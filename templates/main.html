<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="title">FinGuru</div>
    <div class="chat-container">
        
        <div id="chat-box">
            <!-- <div class="bsvg"><img src="/Chat-Bot.svg" alt="chatbot"></div> -->
            <!-- Messages will appear here -->
            <div class="bot-message">Hello !! How may i help you ?</div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Type your message here..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        async function sendMessage() {
            const userMessage = document.getElementById("user-input").value;
            if (!userMessage) return;

            // Append user message to chat
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="user-message">${userMessage}</div>`;
            document.getElementById("user-input").value = "";

            // Send message to backend
            // for local deploy
            //const response = await fetch("http://127.0.0.1:5000/get_response", {
            //     method: "POST",
            //     headers: { "Content-Type": "application/json" },
            //     body: JSON.stringify({ message: userMessage })
            // });

            const response = await fetch("/get_response", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userMessage })
            });
            const data = await response.json();

            const htmlResponse = marked.parse(data.response);

            // Append AI response to chat
            chatBox.innerHTML += `<div class="bot-message">${htmlResponse}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
